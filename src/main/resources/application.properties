spring.application.name=SupportIQ

server.port=${SERVER_PORT:8080}

# --- Datasource (PostgreSQL + pgvector) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:supportiq}
spring.datasource.username=${DB_USER:supportiq}
spring.datasource.password=${DB_PASSWORD:supportiq}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=SupportIQ-Hikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# --- Flyway ---
# No migrations yet; the pgvector table is created by PgVectorEmbeddingStore (createTable=true).
# Enable and add scripts under src/main/resources/db/migration when schema management is needed.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# --- File upload (PDF ingestion) ---
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:20MB}

# --- LangChain4j / Ollama ---
langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
langchain4j.ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.2}

# --- AI provider selection ---
# Provider padrão quando o request nao informar. Valores: ollama | openai | gemini
supportiq.ai.default-provider=${AI_DEFAULT_PROVIDER:ollama}

# OpenAI (habilitado apenas se OPENAI_API_KEY estiver definido)
supportiq.ai.openai.api-key=${OPENAI_API_KEY:}
supportiq.ai.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
supportiq.ai.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Google Gemini (habilitado apenas se GEMINI_API_KEY estiver definido)
supportiq.ai.gemini.api-key=${GEMINI_API_KEY:}
supportiq.ai.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-2.0-flash}
supportiq.ai.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

# --- Chat / RAG ---
supportiq.chat.max-results=${CHAT_MAX_RESULTS:5}
# Session memory is in-memory only (per instance, lost on restart).
supportiq.chat.memory.max-messages=${CHAT_MEMORY_MAX_MESSAGES:20}

# --- Image storage ---
supportiq.ingestion.image-storage-dir=${IMAGE_STORAGE_DIR:./data/images}
supportiq.ingestion.image-base-url=${IMAGE_BASE_URL:/images}

# --- Support ticket (WhatsApp via wa.me link) ---
# O sistema gera um link wa.me para o usuario enviar a mensagem estruturada
# pelo proprio WhatsApp. So precisa do telefone destinatario no formato
# internacional sem "+" (ex: 5541999999999).
supportiq.support.whatsapp.phone=${SUPPORT_WHATSAPP_PHONE:}
