spring.application.name=SupportIQ

server.port=${SERVER_PORT:8080}

# --- Datasource (PostgreSQL + pgvector) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:supportiq}
spring.datasource.username=${DB_USER:supportiq}
spring.datasource.password=${DB_PASSWORD:supportiq}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=SupportIQ-Hikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- Flyway ---
# No migrations yet; the pgvector table is created by PgVectorEmbeddingStore (createTable=true).
# Enable and add scripts under src/main/resources/db/migration when schema management is needed.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# --- File upload (PDF ingestion) ---
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:20MB}

# --- LangChain4j / Ollama ---
langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
langchain4j.ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.2}

# --- Chat / RAG ---
supportiq.chat.max-results=${CHAT_MAX_RESULTS:5}
# Session memory is in-memory only (per instance, lost on restart).
supportiq.chat.memory.max-messages=${CHAT_MEMORY_MAX_MESSAGES:20}
